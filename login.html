<!DOCTYPE html>
<!-- Login: primero usuario/contrase&#241;a; IZC/VALTECH solo si es NIT de cliente. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesi&#243;n - IZC / VALTECH</title>
  <link rel="icon" href="assets/logo/iconoizc.png" type="image/png">
  <style>
    html, body { margin: 0; }
    body.login-empresa-body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      color: #16233f;
      background: #f4f6fa;
    }
    a { color: inherit; text-decoration: none; }
    .top-bar { min-height: 8px; background: #1653a0; }
    .main-header { background: #fff; border-bottom: 1px solid #c5cad0; }
    .main-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-auth { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .header-auth-link {
      display: inline-flex; align-items: center; justify-content: center;
      background: #2a2f35; color: #fff; border-radius: 4px;
      padding: 8px 12px; font-size: 0.82rem; font-weight: 600;
    }
    .auth-page {
      min-height: calc(100vh - 120px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 48px 24px 64px;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: #fff; border: 1px solid #c5cad0; border-radius: 16px;
      padding: 32px 28px; box-shadow: 0 16px 40px rgba(30, 34, 38, 0.12);
    }
    .auth-card h1 { margin: 0 0 8px; font-size: 1.5rem; color: #1a1e22; }
    .auth-lead { margin: 0 0 24px; color: #5a6b85; font-size: 0.95rem; line-height: 1.45; }
    .auth-field { margin-bottom: 16px; }
    .auth-field label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }
    .auth-field input {
      width: 100%; box-sizing: border-box; padding: 12px 14px;
      border: 1px solid #c2d1e5; border-radius: 4px; font-size: 1rem; background: #fff;
    }
    .auth-submit {
      width: 100%; margin-top: 8px; padding: 12px 16px; border: 0; border-radius: 4px;
      background: #1653a0; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .auth-switch { margin-top: 20px; text-align: center; font-size: 0.92rem; color: #5a6b85; }
    .auth-switch a { color: #1653a0; font-weight: 600; }
    .login-step[hidden] { display: none !important; }
  </style>
  <link rel="stylesheet" href="assets/css/index.css?v=37">
  <link rel="stylesheet" href="assets/css/auth.css?v=20">
  <link rel="stylesheet" href="assets/css/login.css?v=14">
  <script src="assets/js/file-boot.js?v=2"></script>
  <script src="assets/js/auth.js?v=91" defer></script>
  <script src="assets/js/login-empresa.js?v=9" defer></script>
  <script src="assets/js/index.js?v=3" defer></script>
</head>
<body class="login-empresa-body login-force-motion">
  <div class="login-bg" aria-hidden="true">
    <span class="login-bg-orb login-bg-orb--a"></span>
    <span class="login-bg-orb login-bg-orb--b"></span>
    <span class="login-bg-orb login-bg-orb--c"></span>
    <span class="login-bg-orb login-bg-orb--d"></span>
    <span class="login-bg-grid"></span>
    <span class="login-bg-sheen"></span>
    <span class="login-bg-dust">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </span>
  </div>
  <div class="top-bar"></div>

  <header class="main-header login-empresa-header">
    <div class="main-header-inner">
      <span class="logo" aria-hidden="true"></span>
      <div style="flex:1"></div>
      <nav class="header-auth login-header-auth" id="headerAuth" aria-label="Acceso">
        <a class="header-auth-link" href="login.html">Iniciar sesi&#243;n</a>
        <a class="header-auth-link" href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>

  <main class="auth-page login-empresa-page">
    <div class="auth-card login-empresa-card">
      <h1>Iniciar sesi&#243;n</h1>
      <p class="auth-lead" id="loginLead">Ingresa tu NIT o c&#243;digo de vendedor y tu contrase&#241;a</p>

      <form id="loginForm" autocomplete="off">
        <input type="hidden" name="empresa" id="loginEmpresa" value="">

        <div class="auth-field">
          <label for="loginNit">Usuario</label>
          <input id="loginNit" name="nit" type="text" placeholder="NIT, V#, Admin IZC&#8230;" required autocomplete="off" value="">
        </div>
        <div class="auth-field">
          <label for="loginPassword">Contrase&#241;a</label>
          <input id="loginPassword" name="password" type="password" placeholder="Tu contrase&#241;a" required minlength="4" autocomplete="new-password" value="">
        </div>

        <section id="loginStepEmpresa" class="login-step login-empresa-pick" hidden aria-label="Elegir empresa">
          <p class="login-empresa-pick-lead">Elige por cu&#225;l p&#225;gina quieres ingresar</p>
          <div class="empresa-choice-grid is-compact" role="group" aria-label="Empresa">
            <button type="button" class="empresa-choice-btn" id="loginChoiceIzc" data-empresa="izc" aria-pressed="false">
              <img src="assets/logo/logoizc.png" alt="IZC Mayorista" class="empresa-choice-logo">
            </button>
            <button type="button" class="empresa-choice-btn" id="loginChoiceValtech" data-empresa="valtech" aria-pressed="false">
              <span class="empresa-choice-logos">
                <img src="assets/logo/valtech.png" alt="VALTECH Mayorista" class="empresa-choice-logo">
                <img src="assets/imgmarcas/SAT.png" alt="SAT Pcs" class="empresa-choice-logo empresa-choice-logo-sat">
              </span>
            </button>
          </div>
        </section>

        <button class="auth-submit" type="submit">Entrar</button>
        <p id="authMessage" class="auth-message" role="status"></p>
      </form>

      <p class="auth-switch">&#191;No tienes cuenta? <a href="registro.html">Reg&#237;strate</a></p>
      <p class="auth-switch">&#191;Eres Gerente de Producto? <a href="registro-gp.html">Registro GP</a></p>
    </div>
  </main>
</body>
</html>
